<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Документ — компактная форма</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --surface: #ffffff;
      --text: #34383d;
      --muted: #6f767d;
      --border: #cfd4d8;
      --border-hover: #aeb6bc;
      --accent: #11889a;
      --accent-hover: #0d7888;
      --accent-soft: #e9f4f6;
      --danger: #d92d3b;
      --focus: rgba(17, 136, 154, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 40px 24px;
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
    }

    .card {
      width: min(900px, 100%);
      background: var(--surface);
      border: 1px solid #e2e5e8;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(31, 42, 51, 0.05);
    }

    .form {
      padding: 28px 32px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .field label {
      font-size: 13px;
      line-height: 1.25;
      font-weight: 600;
      color: var(--muted);
    }

    .field input,
    .field select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .field input:hover,
    .field select:hover {
      border-color: var(--border-hover);
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .field input::placeholder {
      color: #9aa1a7;
    }

    .field input:disabled,
    .field select:disabled {
      background: #f3f5f6;
      border-color: #d9dde0;
      color: #969da3;
      cursor: not-allowed;
      opacity: 1;
    }

    .doc-type { grid-column: span 9; }
    .main-flag { grid-column: span 3; }
    .series { grid-column: span 3; }
    .number { grid-column: span 4; }
    .issuer { grid-column: span 12; }
    .code { grid-column: span 6; }
    .issue-date { grid-column: span 4; }
    .expire-date { grid-column: span 4; }
    .extra { grid-column: span 12; }

    .main-flag {
      display: flex;
      align-items: flex-end;
      padding-bottom: 5px;
    }

    .checkbox {
      height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text);
      font-size: 15px;
      user-select: none;
    }

    .checkbox input {
      appearance: none;
      width: 20px;
      height: 20px;
      margin: 0;
      border: 1.5px solid var(--border-hover);
      border-radius: 5px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .15s ease;
    }

    .checkbox input:checked {
      border-color: var(--accent);
      background: var(--accent);
    }

    .checkbox input:checked::after {
      content: "";
      width: 8px;
      height: 4px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) translateY(-1px);
    }

    .divider {
      height: 1px;
      background: #e7e9eb;
      margin: 24px -32px 20px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      height: 40px;
      border-radius: 7px;
      padding: 0 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      border: 1px solid transparent;
      transition: .15s ease;
    }

    .primary {
      color: #fff;
      background: var(--accent);
    }

    .primary:hover { background: var(--accent-hover); }

    .secondary {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .secondary:hover { background: #dceef1; }

    .delete {
      margin-left: auto;
      width: 40px;
      padding: 0;
      background: transparent;
      color: var(--danger);
      border-color: transparent;
      font-size: 20px;
    }

    .delete:hover {
      background: #fff0f2;
    }

    @media (max-width: 720px) {
      body { padding: 16px; }
      .form { padding: 22px 20px 18px; }
      .divider { margin-left: -20px; margin-right: -20px; }

      .doc-type, .main-flag, .series, .number, .issuer, .code,
      .issue-date, .expire-date, .extra {
        grid-column: 1 / -1;
      }

      .main-flag {
        align-items: flex-start;
        padding-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <section class="card" aria-label="Документ">
    <form class="form">
      <div class="grid">
        <div class="field doc-type">
          <label for="doc-type">Тип документа</label>
          <select id="doc-type">
            <option>Паспорт гражданина РФ</option>
          </select>
        </div>

        <div class="main-flag">
          <label class="checkbox">
            <input type="checkbox" />
            <span>Основной</span>
          </label>
        </div>

        <div class="field series">
          <label for="series">Серия</label>
          <input id="series" type="text" value="4509" disabled />
        </div>

        <div class="field number">
          <label for="number">Номер</label>
          <input id="number" type="text" placeholder="000000" />
        </div>

        <div class="field issuer">
          <label for="issuer">Кем выдан</label>
          <input id="issuer" type="text" placeholder="Подразделение, район" />
        </div>

        <div class="field code">
          <label for="code">Код подразделения</label>
          <input id="code" type="text" placeholder="000-000" />
        </div>

        <div class="field issue-date">
          <label for="issue-date">Дата выдачи</label>
          <input id="issue-date" type="date" />
        </div>

        <div class="field expire-date">
          <label for="expire-date">Дата истечения</label>
          <input id="expire-date" type="date" />
        </div>

        <div class="field extra">
          <label for="extra">Дополнительно</label>
          <input id="extra" type="text" placeholder="Другая информация" />
        </div>
      </div>

      <div class="divider"></div>

      <div class="actions">
        <button class="primary" type="button">Стандартизовать</button>
        <button class="secondary" type="button">Подтвердить</button>
        <button class="delete" type="button" aria-label="Удалить">⌫</button>
      </div>
    </form>
  </section>
</body>
</html>
